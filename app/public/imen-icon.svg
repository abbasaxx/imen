<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient: deep blue → violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1D4ED8"/>
      <stop offset="50%"  stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- Shield gradient: white → soft blue-white -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="1"/>
    </linearGradient>

    <!-- Inner glow behind shield -->
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>

    <!-- Check-mark gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Gloss overlay -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
    <filter id="shieldShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.20"/>
    </filter>
    <clipPath id="roundRect">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- ── Background ── -->
  <g clip-path="url(#roundRect)">
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Subtle radial glow -->
    <ellipse cx="256" cy="200" rx="280" ry="220" fill="url(#glowGrad)"/>

    <!-- Decorative circles (top-right) -->
    <circle cx="420" cy="80"  r="90"  fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="460" cy="130" r="55"  fill="#FFFFFF" fill-opacity="0.05"/>

    <!-- Decorative circles (bottom-left) -->
    <circle cx="80"  cy="440" r="100" fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="40"  cy="390" r="60"  fill="#FFFFFF" fill-opacity="0.05"/>

    <!-- ── Shield ── -->
    <g filter="url(#shieldShadow)">
      <!--
        Shield path: top-center point, curves down the sides,
        meets at a rounded bottom tip.
      -->
      <path
        d="M256 108
           L376 158
           C380 158 384 162 384 166
           L384 282
           C384 352 322 400 261 423
           C258 424 254 424 251 423
           C190 400 128 352 128 282
           L128 166
           C128 162 132 158 136 158
           Z"
        fill="url(#shieldGrad)"
      />
    </g>

    <!-- Shield inner subtle border -->
    <path
      d="M256 120
         L368 167
         L368 282
         C368 344 312 389 256 410
         C200 389 144 344 144 282
         L144 167
         Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.5"
      stroke-width="2"
    />

    <!-- ── Check-mark ── -->
    <polyline
      points="200,262 238,300 318,215"
      fill="none"
      stroke="url(#checkGrad)"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- ── Gloss overlay ── -->
    <rect width="512" height="512" fill="url(#gloss)"/>
  </g>

  <!-- Rounded border stroke -->
  <rect
    width="512" height="512" rx="112"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.10"
    stroke-width="2"
  />
</svg>
